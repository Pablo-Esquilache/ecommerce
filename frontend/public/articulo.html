<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo | Iconografía Bizantina — María Magdalena</title>
    <meta name="description" content="Lectura de artículo sobre iconografía bizantina y arte sacro tradicional.">
    <link rel="icon" type="image/png" href="/img/favicon.png">

    <!-- Tipografías y Estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .article-hero {
            margin: 78px auto 0 auto;
            max-width: 1240px;
            width: calc(100% - 40px);
            height: 54vh;
            min-height: 400px;
            max-height: 520px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(14, 42, 71, 0.16);
            background-color: #0E2A47;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
        }

        .article-hero-video {
            background-color: #000;
            display: block;
            padding: 0;
        }

        .article-hero-video iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .article-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(14, 42, 71, 0.25) 0%, rgba(14, 42, 71, 0.88) 100%);
            z-index: 1;
        }

        .article-hero-content {
            position: relative;
            z-index: 2;
            padding: 40px 45px;
            max-width: 900px;
            color: #fff;
        }

        .article-hero-badge {
            display: inline-block;
            background: #C78515;
            color: #fff;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .article-hero-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            line-height: 1.25;
            margin: 0 0 14px;
            color: #FAF8F5;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.55);
        }

        .article-hero-subtitle {
            font-size: 1.15rem;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* Contenido de Lectura */
        .article-reading-container {
            max-width: 860px;
            margin: 40px auto 90px;
            padding: 0 20px;
        }

        .article-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 35px;
            border-bottom: 1px solid rgba(199, 133, 21, 0.25);
            font-size: 0.92rem;
            color: #666;
            flex-wrap: wrap;
            gap: 12px;
        }

        .article-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .article-author img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #C78515;
        }

        .article-body {
            font-size: 1.12rem;
            line-height: 1.85;
            color: #2c3e50;
            letter-spacing: 0.2px;
        }

        .article-body p {
            margin-bottom: 24px;
        }

        .article-body h2, .article-body h3 {
            font-family: 'Cinzel', serif;
            color: #0E2A47;
            margin-top: 40px;
            margin-bottom: 18px;
            line-height: 1.35;
        }

        .article-body blockquote {
            margin: 35px 0;
            padding: 20px 25px;
            border-left: 4px solid #C78515;
            background: #FAF8F5;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            color: #444;
            font-size: 1.15rem;
        }

        /* Banner CTA al final del artículo */
        .article-cta-box {
            margin-top: 60px;
            padding: 35px;
            background: linear-gradient(135deg, #0E2A47 0%, #153e66 100%);
            border-radius: 14px;
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 25px rgba(14, 42, 71, 0.15);
        }
        .article-cta-box h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: #FAF8F5;
            margin-bottom: 10px;
        }
        .article-cta-box p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
            max-width: 600px;
            margin: 0 auto 20px;
        }
        .article-cta-box .btn {
            background-color: #C78515;
            color: #fff;
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: background 0.3s;
        }
        .article-cta-box .btn:hover {
            background-color: #a66d0e;
        }

        .back-nav-wrap {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 768px) {
            .article-hero {
                margin: 65px auto 0 auto;
                width: calc(100% - 24px);
                height: 46vh;
                min-height: 320px;
                border-radius: 16px;
            }
            .article-hero-content {
                padding: 25px 20px;
            }
            .article-hero-title {
                font-size: 1.7rem;
            }
            .article-hero-subtitle {
                font-size: 0.95rem;
            }
            .article-body {
                font-size: 1.05rem;
                line-height: 1.75;
            }
            .article-video-title-wrap h1 {
                font-size: 1.7rem !important;
            }
            .article-video-title-wrap p {
                font-size: 0.95rem !important;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar glass-navbar">
        <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo">
                <a href="/">
                    <img src="img/logo.png" alt="Iconografía Bizantina" style="height: 40px; width: 40px; object-fit: cover; border-radius: 6px; display: block; margin: 8px 0;" width="40" height="40">
                </a>
            </div>
            
            <div style="display: flex; gap: 10px; align-items: center;">
                <a href="blog.html" style="display: inline-flex; align-items: center; gap: 6px; background: transparent; color: #0E2A47; padding: 9px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid rgba(14, 42, 71, 0.25); transition: all 0.2s;">
                    <i class="fas fa-feather-alt"></i> Blog
                </a>
                <a href="/" style="display: inline-flex; align-items: center; gap: 8px; background: #0E2A47; color: #FAF8F5; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(14, 42, 71, 0.15);">
                    <i class="fas fa-arrow-left"></i> Volver a la Tienda
                </a>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal (cargado dinámicamente) -->
    <div id="article-wrapper">
        <div style="text-align:center; padding: 160px 20px;">
            <i class="fas fa-spinner fa-spin" style="font-size: 32px; color: #C78515;"></i>
            <p style="margin-top: 15px; color: #666; font-size: 16px;">Cargando publicación...</p>
        </div>
    </div>

    <!-- Footer Simplificado -->
    <footer style="padding: 25px 0; background: #07192b; border-top: 1px solid rgba(199, 133, 21, 0.2);">
        <div class="footer-bottom" style="border-top: none; margin-top: 0; padding-top: 0;">
            <p>&copy; 2026 Iconografía Bizantina. Todos los derechos reservados. | Desarrollador: Pablo Esquilache</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getYouTubeEmbedUrl(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
        }

        async function cargarDetalleArticulo() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            const wrapper = document.getElementById('article-wrapper');

            if (!id) {
                window.location.href = 'blog.html';
                return;
            }

            try {
                const res = await fetch(`/api/blog/${id}`);
                if (!res.ok) throw new Error('Artículo no encontrado');
                const art = await res.json();

                // Actualizar título de la pestaña
                document.title = `${escapeHtml(art.titulo)} | Iconografía Bizantina`;

                const fecha = new Date(art.creado_en || Date.now()).toLocaleDateString('es-AR', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });

                const youtubeEmbedUrl = getYouTubeEmbedUrl(art.youtube_url);
                const portadaUrl = art.imagen_portada || '/img/portada1.webp';
                const tituloEsc = escapeHtml(art.titulo);
                const subtituloEsc = art.subtitulo ? escapeHtml(art.subtitulo) : '';

                // Formatear párrafos del contenido de forma segura con escapeHtml
                const parrafos = (art.contenido || '')
                    .split(/\n\s*\n/)
                    .map(p => p.trim())
                    .filter(p => p.length > 0)
                    .map(p => `<p>${escapeHtml(p).replace(/\n/g, '<br>')}</p>`)
                    .join('');

                const headerHtml = youtubeEmbedUrl ? `
                    <!-- Hero Section con Video de YouTube (mismo espacio exacto que la portada) -->
                    <header class="article-hero article-hero-video">
                        <iframe 
                            src="${youtubeEmbedUrl}" 
                            title="${tituloEsc}" 
                            style="width: 100%; height: 100%; border: none; display: block;" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                        </iframe>
                    </header>
                ` : `
                    <!-- Hero Section con Imagen de Portada -->
                    <header class="article-hero" style="background-image: url('${portadaUrl}');">
                        <div class="article-hero-overlay"></div>
                        <div class="article-hero-content">
                            <span class="article-hero-badge"><i class="fas fa-feather-alt"></i> Arte Sacro</span>
                            <h1 class="article-hero-title">${tituloEsc}</h1>
                            ${subtituloEsc ? `<p class="article-hero-subtitle">${subtituloEsc}</p>` : ''}
                        </div>
                    </header>
                `;

                const titleSectionUnderVideo = youtubeEmbedUrl ? `
                    <div class="article-video-title-wrap" style="margin-bottom: 28px;">
                        <span class="article-hero-badge"><i class="fas fa-feather-alt"></i> Arte Sacro</span>
                        <h1 style="font-family: 'Cinzel', serif; font-size: 2.3rem; line-height: 1.25; color: #0E2A47; margin: 10px 0 12px;">${tituloEsc}</h1>
                        ${subtituloEsc ? `<p style="font-size: 1.15rem; line-height: 1.55; color: #555; margin: 0;">${subtituloEsc}</p>` : ''}
                    </div>
                ` : '';

                wrapper.innerHTML = `
                    ${headerHtml}

                    <!-- Zona de Lectura 100% -->
                    <main class="article-reading-container">
                        ${titleSectionUnderVideo}
                        <div class="article-meta-bar">
                            <div class="article-author">
                                <img src="/img/quienes_somos_1.webp" alt="Giselle Ochoa" onerror="this.src='/img/favicon.png'">
                                <div>
                                    <strong style="color:#0E2A47; display:block;">Giselle Ochoa</strong>
                                    <small style="color:#777;">Iconógrafa y Docente</small>
                                </div>
                            </div>
                            <div>
                                <i class="far fa-calendar-alt" style="color:#C78515;"></i> Publicado el ${fecha}
                            </div>
                        </div>

                        <article class="article-body">
                            ${parrafos}
                        </article>

                        <!-- Barra de navegación inferior y compartir -->
                        <div class="back-nav-wrap" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 18px; margin-top: 40px; padding-top: 25px; border-top: 1px solid rgba(199, 133, 21, 0.2);">
                            <a href="blog.html" class="btn" style="background:#f4ede2; color:#0E2A47; text-decoration:none; font-weight:600; display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(199, 133, 21, 0.3); padding:10px 20px; border-radius:6px;">
                                <i class="fas fa-arrow-left"></i> Volver a publicaciones
                            </a>

                            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                                <span style="font-weight: 600; font-size: 14px; color: #555;"><i class="fas fa-share-alt" style="color: #C78515;"></i> Compartir:</span>
                                
                                <!-- WhatsApp directo -->
                                <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(art.titulo + ' - ' + window.location.href)}" target="_blank" rel="noopener noreferrer" title="Compartir por WhatsApp" style="background: #25D366; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); transition: transform 0.2s;">
                                    <i class="fab fa-whatsapp"></i>
                                </a>

                                <!-- Email directo -->
                                <a href="mailto:?subject=${encodeURIComponent(art.titulo + ' | Iconografía Bizantina')}&body=${encodeURIComponent('Hola, te comparto esta publicación sobre iconografía y arte sacro:\n\n' + window.location.href)}" title="Compartir por Correo" style="background: #0E2A47; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; box-shadow: 0 4px 10px rgba(14, 42, 71, 0.25); transition: transform 0.2s;">
                                    <i class="fas fa-envelope"></i>
                                </a>

                                <!-- Menú nativo del dispositivo (WhatsApp, redes, otras apps) -->
                                <button type="button" id="btn-compartir-nativo" title="Más opciones de compartir" style="background: #C78515; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: none; cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(199, 133, 21, 0.3); transition: transform 0.2s;">
                                    <i class="fas fa-ellipsis-h"></i>
                                </button>
                            </div>
                        </div>
                    </main>
                `;

                const btnShare = document.getElementById('btn-compartir-nativo');
                if (btnShare) {
                    btnShare.addEventListener('click', () => {
                        compartirArticuloNativo(art.titulo, art.subtitulo || '');
                    });
                }

            } catch (err) {
                console.error(err);
                wrapper.innerHTML = `
                    <div style="text-align:center; padding: 140px 20px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #e74c3c; margin-bottom: 15px;"></i>
                        <h2 style="font-family:'Cinzel', serif; color:#0E2A47;">No pudimos encontrar este artículo</h2>
                        <p style="color:#666; margin: 15px 0 25px;">Es posible que la publicación haya sido eliminada o que el enlace sea incorrecto.</p>
                        <a href="blog.html" class="btn btn-primary" style="background:#C78515; border-color:#C78515; text-decoration:none; display:inline-block;">
                            Volver al Blog
                        </a>
                    </div>
                `;
            }
        }

        function compartirArticuloNativo(titulo, subtitulo) {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: titulo,
                    text: subtitulo || titulo,
                    url: url
                }).catch(err => {
                    if (err.name !== 'AbortError') console.warn('Error al compartir:', err);
                });
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    alert('¡Enlace del artículo copiado al portapapeles!');
                }).catch(() => {
                    prompt('Copia el enlace para compartirlo:', url);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', cargarDetalleArticulo);
    </script>
</body>
</html>
