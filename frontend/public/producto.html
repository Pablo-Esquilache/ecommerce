<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Obra | Iconograf�a Bizantina</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-detail-container { margin-top: 100px; display: flex; gap: 40px; margin-bottom: 60px; }
        .product-gallery { flex: 1; }
        .main-img { width: 100%; height: 400px; object-fit: contain; background: var(--white); border-radius: 8px; box-shadow: var(--shadow); margin-bottom: 20px;}
        .thumbnails { display: flex; gap: 15px; }
        .thumbnails img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
        .thumbnails img:hover { border-color: var(--primary); }
        .product-info-detail { flex: 1; background: var(--white); padding: 30px; border-radius: 8px; box-shadow: var(--shadow); }
        h1 { font-size: 32px; margin-bottom: 10px; }
        .price { font-size: 28px; color: var(--primary); font-weight: bold; margin-bottom: 20px; }
        .stock-info { font-size: 14px; margin-bottom: 20px; color: var(--light-text); }
        .description { font-size: 16px; line-height: 1.8; margin-bottom: 30px; }
        .meta-data { margin-bottom: 30px; font-size: 14px; }
        .meta-data p { margin-bottom: 5px; }
        .add-to-cart-section { display: flex; gap: 20px; align-items: center; border-top: 1px solid var(--border); padding-top: 20px;}
        .qty-input { width: 60px; padding: 10px; border: 1px solid var(--border); border-radius: 4px; text-align: center;}
        
        @media (max-width: 768px) {
            .product-detail-container { flex-direction: column; }
            .main-img { height: 300px; }
        }
    </style>

    <!-- Sentry Error Tracking -->
    
    <!-- Botón Flotante Scroll Top -->
    <button class="scroll-top-btn" id="scroll-top-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})">
        <i class="fas fa-arrow-up"></i>
    </button>
    
    <script src="https://js.sentry-cdn.com/68477c523d410979c6ba66a13bfe6476.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <a href="/"><img src="/img/logo.png" alt="Iconografía Bizantina" style="height: 52px; width: 52px; object-fit: cover; border-radius: 6px; display: block; margin: 4px 0;"></a>
            </div>
            <ul class="nav-links">
                <li><a href="/#productos"><i class="fas fa-arrow-left"></i> Volver a Productos</a></li>
            </ul>
            <div class="nav-icons">
                <div class="cart-icon" onclick="toggleCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container product-detail-container" id="product-detail-content">
        <!-- Renderizado dinámico desde JS -->
        <h2>Cargando producto...</h2>
    </div>

    <!-- Módulo de Carrito Lateral -->
    <div class="side-cart" id="side-cart">
        <div class="cart-header">
            <h3>Tu Carrito</h3>
            <button class="close-cart" onclick="toggleCart()"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="subtotal"><span>Subtotal:</span><span id="cart-subtotal">$0.00</span></div>
            <button class="btn btn-block" onclick="goToCheckout()">Ir al Checkout</button>
        </div>
    </div>
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    
    <!-- Botón Flotante Scroll Top -->
    <button class="scroll-top-btn" id="scroll-top-btn" onclick="window.scrollTo({top:0, behavior:'smooth'})">
        <i class="fas fa-arrow-up"></i>
    </button>
    
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                document.getElementById('product-detail-content').innerHTML = `<h2>Producto no encontrado o enlace inválido.</h2>`;
                return;
            }

            try {
                const [res, resConf] = await Promise.all([
                    fetch(`/api/productos/${productId}`),
                    fetch('/api/configuracion').catch(() => null)
                ]);
                if (!res.ok) throw new Error("Producto no encontrado");
                const p = await res.json();
                const conf = (resConf && resConf.ok) ? await resConf.json() : {};
                
                const img1 = p.imagen_1 || 'https://via.placeholder.com/600';
                const img2Attr = p.imagen_2 ? `src="${p.imagen_2}"` : 'style="display:none"';
                const img3Attr = p.imagen_3 ? `src="${p.imagen_3}"` : 'style="display:none"';

                document.getElementById('product-detail-content').innerHTML = `
                    <div class="product-gallery">
                        <img src="${img1}" class="main-img" id="main-product-img">
                        <div class="thumbnails">
                            <img src="${img1}" onclick="document.getElementById('main-product-img').src=this.src">
                            <img ${img2Attr} onclick="document.getElementById('main-product-img').src=this.src">
                            <img ${img3Attr} onclick="document.getElementById('main-product-img').src=this.src">
                        </div>
                    </div>
                    <div class="product-info-detail">
                        <h1>${p.nombre}</h1>
                        ${renderPriceHTML(p)}
                        
                        <div id="cupos-container">
                        ${(() => {
                            const isFisico = !p.tipo_producto || p.tipo_producto === 'fisico';
                            const isDigital = p.tipo_producto === 'digital';
                            const isTaller = p.tipo_producto === 'taller';
                            const isViaje = p.tipo_producto === 'viaje';

                            if (isFisico) {
                                return `<p class="stock-info" style="color:#0E2A47; font-weight:500;">Stock disponible: <strong style="color:#C78515;">${p.stock} unidades</strong></p>`;
                            } else if (isTaller) {
                                return `<p class="stock-info" style="color:#0E2A47; font-weight:500;">Cupos presenciales disponibles: <strong style="color:#C78515;">${p.stock} lugares</strong></p>`;
                            } else if (isViaje) {
                                return `<p class="stock-info" style="color:#0E2A47; font-weight:500;">Cupos disponibles: <strong style="color:#C78515;">${p.stock} lugares</strong></p>`;
                            } else if (isDigital) {
                                return `<p class="stock-info" style="color:#0E2A47; font-weight:500;">Formato: <strong style="color:#C78515;">Acceso Digital Inmediato</strong></p>`;
                            }
                            return '';
                        })()}
                        </div>

                        ${(() => {
                            const isTaller = p.tipo_producto === 'taller';
                            if (!isTaller) return '';
                            return `
                                <div style="margin: 15px 0; background-color: #FAF8F5; padding: 14px 16px; border-radius: 8px; border: 1px solid #E2D9CC;">
                                    <label for="select-modalidad" style="display:block; font-weight:600; font-size:14px; color:#0E2A47; margin-bottom:8px;">
                                        <i class="fas fa-user-check" style="color:#C78515;"></i> Modalidad de participación:
                                    </label>
                                    <select id="select-modalidad" onchange="window.cambiarModalidadEvento(this.value, ${p.stock})" style="width:100%; padding:10px 12px; border-radius:6px; border:1px solid #C78515; font-size:14px; font-weight:600; color:#0E2A47; background:#fff; outline:none; cursor:pointer;">
                                        <option value="presencial">Presencial (Cupos limitados en sede)</option>
                                        <option value="online">Online (En vivo / Transmisión remota)</option>
                                    </select>
                                </div>
                            `;
                        })()}
                        
                        <div class="description">
                            ${p.descripcion ? p.descripcion.replace(/\n/g, '<br>') : ''}
                        </div>

                        <div class="meta-data">
                            <p><strong>ID:</strong> ${p.id}</p>
                            <p><strong>Categoría:</strong> <span style="text-transform:capitalize;">${p.categoria || '-'}</span></p>
                            ${(() => {
                                const isFisico = !p.tipo_producto || p.tipo_producto === 'fisico';
                                let meta = '';
                                if (isFisico) {
                                    if (p.peso) meta += `<p><strong>Peso:</strong> ${p.peso} kg</p>`;
                                    if (p.dimensiones) meta += `<p><strong>Dimensiones:</strong> ${p.dimensiones}</p>`;
                                } else {
                                    if (p.fecha_inicio) {
                                        const fIni = new Date(p.fecha_inicio).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' });
                                        meta += `<p><strong>${p.tipo_producto === 'taller' ? 'Inicio del taller:' : 'Fecha de salida:'}</strong> <span style="color:#0E2A47; font-weight:600;">${fIni}</span></p>`;
                                    }
                                    if (p.fecha_cierre_inscripcion) {
                                        const fCie = new Date(p.fecha_cierre_inscripcion).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' });
                                        meta += `<p><strong>Cierre de inscripción:</strong> <span style="color:#C78515; font-weight:600;">${fCie}</span></p>`;
                                    }
                                }
                                return meta;
                            })()}
                        </div>

                        ${(() => {
                            const isFisico = !p.tipo_producto || p.tipo_producto === 'fisico';
                            const isDigital = p.tipo_producto === 'digital';
                            if (isFisico) {
                                if (conf.correo_activo) {
                                    return `<div style="background-color: #FAF8F5; padding: 14px 16px; border-radius: 8px; margin-top: 15px; border-left: 4px solid #C78515;">
                                         <p style="color: #0E2A47; font-size: 14px; margin: 0; line-height: 1.5;">
                                             <strong><i class="fas fa-truck"></i> Envíos a todo el país</strong><br>
                                             Envíos gestionados por Correo Argentino. El costo exacto se calculará automáticamente según tu código postal en el checkout. Embalaje especializado para piezas sagradas.
                                         </p>
                                       </div>`;
                                } else {
                                    return `<div style="background-color: #FAF8F5; padding: 14px 16px; border-radius: 8px; margin-top: 15px; border-left: 4px solid #C78515;">
                                         <p style="color: #0E2A47; font-size: 14px; margin: 0; line-height: 1.5;">
                                             <strong><i class="fas fa-box"></i> Envío a convenir</strong><br>
                                             El envío es a cargo del comprador y se abona al momento de la entrega. Embalaje y protección especializada para piezas sagradas únicas.
                                         </p>
                                       </div>`;
                                }
                            } else if (isDigital) {
                                return `<div style="background-color: #FAF8F5; padding: 14px 16px; border-radius: 8px; margin-top: 15px; border-left: 4px solid #C78515;">
                                     <p style="color: #0E2A47; font-size: 14px; margin: 0; line-height: 1.5;">
                                         <strong><i class="fas fa-envelope-open-text"></i> Información enviada por Email</strong><br>
                                         Al confirmarse el pago, recibirás de forma automática en tu correo electrónico el enlace de acceso y los archivos descargables.
                                     </p>
                                   </div>`;
                            } else {
                                return `<div style="background-color: #FAF8F5; padding: 14px 16px; border-radius: 8px; margin-top: 15px; border-left: 4px solid #C78515;">
                                     <p style="color: #0E2A47; font-size: 14px; margin: 0; line-height: 1.5;">
                                         <strong><i class="fas fa-envelope-open-text"></i> Información enviada por Email</strong><br>
                                         Una vez confirmada tu inscripción, recibirás en tu correo electrónico la información completa, cronograma, instrucciones y enlaces de encuentro.
                                     </p>
                                   </div>`;
                            }
                        })()}

                        <div class="add-to-cart-section">
                            <input type="number" id="detail-qty" class="qty-input" value="1" min="1" max="${p.stock}">
                            <button class="btn" onclick="agregarMultipleAlCarrito(${p.id}, '${p.nombre.replace(/'/g, "\\'")}', ${p.precio}, ${parseFloat(p.precio_usd) || 0}, '${img1}', '${p.tipo_producto || 'fisico'}')">
                                ${p.tipo_producto === 'taller' 
                                    ? '<i class="fas fa-user-plus"></i> Inscribirme' 
                                    : (p.tipo_producto === 'viaje' 
                                        ? '<i class="fas fa-ticket-alt"></i> Reservar' 
                                        : '<i class="fas fa-cart-plus"></i> Agregar al Carrito')}
                            </button>
                        </div>
                    </div>
                `;

            } catch(e) {
                document.getElementById('product-detail-content').innerHTML = `<h2>Error: ${e.message}</h2>`;
            }
        });

        window.cambiarModalidadEvento = function(modalidad, stockReal) {
            const cuposDiv = document.getElementById('cupos-container');
            const qtyInput = document.getElementById('detail-qty');
            if (!cuposDiv) return;
            if (modalidad === 'online') {
                cuposDiv.innerHTML = '<p class="stock-info" style="color:#0E2A47; font-weight:500;">Modalidad Online: <strong style="color:#C78515;">Acceso virtual (Sin límite de cupo presencial)</strong></p>';
                if (qtyInput) qtyInput.setAttribute('max', '99');
            } else {
                cuposDiv.innerHTML = `<p class="stock-info" style="color:#0E2A47; font-weight:500;">Cupos presenciales disponibles: <strong style="color:#C78515;">${stockReal} lugares</strong></p>`;
                if (qtyInput) qtyInput.setAttribute('max', stockReal);
            }
        };

        function agregarMultipleAlCarrito(id, nombre, precio, precio_usd, img, tipo_producto) {
            const qtyInput = document.getElementById('detail-qty');
            if (!qtyInput) return;
            const cant = parseInt(qtyInput.value) || 1;
            
            const selectMod = document.getElementById('select-modalidad');
            const modalidad = (tipo_producto === 'taller' && selectMod) ? selectMod.value : (tipo_producto === 'digital' ? 'online' : 'presencial');
            const modLabel = (tipo_producto === 'taller') ? (modalidad === 'online' ? ' (Online)' : ' (Presencial)') : '';
            const nombreCompleto = nombre + modLabel;

            let itemExistente = carrito.find(item => item.id === id && item.modalidad === modalidad);
            if (itemExistente) {
                itemExistente.cantidad += cant;
            } else {
                carrito.push({
                    id,
                    nombre: nombreCompleto,
                    nombre_base: nombre,
                    precio,
                    precio_usd,
                    img,
                    tipo_producto,
                    modalidad,
                    cantidad: cant
                });
            }
            saveCart();
            toggleCart();
        }
    </script>
</body>
</html>
