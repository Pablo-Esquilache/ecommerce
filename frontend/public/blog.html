<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Iconografía Bizantina — María Magdalena</title>
    <meta name="description" content="Artículos, reflexiones y técnicas sobre la iconografía bizantina y el arte sacro tradicional por Giselle Ochoa.">
    <meta name="keywords" content="blog iconografía bizantina, técnicas temple de huevo, historia iconos bizantinos, arte sacro, Giselle Ochoa">
    <meta name="author" content="Giselle Ochoa">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://iconografiabizantina.netlify.app/blog.html">

    <!-- Open Graph -->
    <meta property="og:site_name" content="Iconografía Bizantina">
    <meta property="og:title" content="Blog | Iconografía Bizantina — María Magdalena">
    <meta property="og:description" content="Artículos, reflexiones y técnicas sobre la iconografía bizantina y el arte sacro tradicional por Giselle Ochoa.">
    <meta property="og:image" content="https://iconografiabizantina.netlify.app/img/og-image.jpg">
    <meta property="og:url" content="https://iconografiabizantina.netlify.app/blog.html">
    <meta property="og:type" content="blog">

    <link rel="icon" type="image/png" href="/img/favicon.png">

    <!-- Tipografías y Estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .blog-hero {
            text-align: center;
            padding: 120px 20px 50px;
            background: linear-gradient(180deg, rgba(250, 248, 245, 0.8) 0%, rgba(255, 255, 255, 1) 100%);
        }
        .blog-hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: #0E2A47;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .blog-hero p {
            font-size: 1.1rem;
            color: #666;
            max-width: 650px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }
        .blog-search-bar {
            max-width: 450px;
            margin: 0 auto;
            position: relative;
        }
        .blog-search-bar input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 30px;
            border: 1px solid rgba(199, 133, 21, 0.35);
            background: #fff;
            font-size: 14px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            transition: border-color 0.3s;
        }
        .blog-search-bar input:focus {
            border-color: #C78515;
        }
        .blog-search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #C78515;
            font-size: 15px;
        }

        .blog-grid-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 20px 80px;
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
        }

        .blog-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(199, 133, 21, 0.22);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }
        .blog-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(199, 133, 21, 0.18);
            border-color: #C78515;
        }
        .blog-card-img-wrap {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: #f4ede2;
        }
        .blog-card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .blog-card:hover .blog-card-img-wrap img {
            transform: scale(1.05);
        }
        .blog-card-body {
            padding: 22px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .blog-card-meta {
            font-size: 0.8rem;
            color: #C78515;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .blog-card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            color: #0E2A47;
            margin: 0 0 10px;
            line-height: 1.35;
            font-weight: 700;
        }
        .blog-card-subtitle {
            font-size: 0.92rem;
            color: #666;
            line-height: 1.55;
            margin: 0 0 18px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .blog-card-cta {
            font-size: 0.9rem;
            font-weight: 600;
            color: #C78515;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: gap 0.2s;
        }
        .blog-card:hover .blog-card-cta {
            gap: 10px;
        }

        .blog-empty {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
        .blog-empty i {
            font-size: 48px;
            color: #C78515;
            margin-bottom: 15px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar glass-navbar">
        <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo">
                <a href="/">
                    <img src="img/logo.png" alt="Iconografía Bizantina" style="height: 40px; width: 40px; object-fit: cover; border-radius: 6px; display: block; margin: 8px 0;" width="40" height="40">
                </a>
            </div>
            
            <div>
                <a href="/" style="display: inline-flex; align-items: center; gap: 8px; background: #0E2A47; color: #FAF8F5; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(14, 42, 71, 0.15);">
                    <i class="fas fa-arrow-left"></i> Volver a la Tienda
                </a>
            </div>
        </div>
    </nav>

    <!-- Header Hero del Blog -->
    <header class="blog-hero">
        <h1>Crónicas & Arte Sacro</h1>
        <p>Reflexiones sobre la teología de la imagen, técnicas ancestrales al temple de huevo y vivencias en el taller de iconografía.</p>
        <div class="blog-search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="blog-search-input" placeholder="Buscar por título o palabra clave...">
        </div>
    </header>

    <!-- Grilla de Artículos -->
    <main class="blog-grid-section">
        <div id="articulos-container" class="blog-grid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 28px; color: #C78515;"></i>
                <p style="margin-top: 10px; color: #666;">Cargando artículos...</p>
            </div>
        </div>
    </main>

    <!-- Footer Simplificado -->
    <footer style="padding: 25px 0; background: #07192b; border-top: 1px solid rgba(199, 133, 21, 0.2);">
        <div class="footer-bottom" style="border-top: none; margin-top: 0; padding-top: 0;">
            <p>&copy; 2026 Iconografía Bizantina. Todos los derechos reservados. | Desarrollador: Pablo Esquilache</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/js/main.js"></script>
    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        let blogArticulosCache = [];

        async function cargarArticulosBlog() {
            const container = document.getElementById('articulos-container');
            try {
                const res = await fetch('/api/blog');
                if (!res.ok) throw new Error('Error al conectar con el servidor');
                blogArticulosCache = await res.json();
                renderArticulos(blogArticulosCache);
            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="blog-empty" style="grid-column: 1 / -1;">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>No pudimos cargar los artículos</h3>
                        <p>Por favor, intenta nuevamente en unos momentos.</p>
                    </div>
                `;
            }
        }

        function renderArticulos(articulos) {
            const container = document.getElementById('articulos-container');
            if (!Array.isArray(articulos) || articulos.length === 0) {
                container.innerHTML = `
                    <div class="blog-empty" style="grid-column: 1 / -1;">
                        <i class="fas fa-feather-alt"></i>
                        <h3 style="font-family:'Cinzel', serif; color:#0E2A47;">Aún no hay publicaciones</h3>
                        <p>Pronto compartiremos reflexiones, ensayos y novedades sobre arte sacro e iconografía tradicional.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = articulos.map(art => {
                const fecha = new Date(art.creado_en || Date.now()).toLocaleDateString('es-AR', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });

                const portadaUrl = art.imagen_portada || '/img/portada1.webp';
                const titEsc = escapeHtml(art.titulo);
                const subEsc = art.subtitulo ? escapeHtml(art.subtitulo) : '';

                return `
                    <a href="articulo.html?id=${art.id}" class="blog-card">
                        <div class="blog-card-img-wrap">
                            <img src="${portadaUrl}" alt="${titEsc}" loading="lazy">
                        </div>
                        <div class="blog-card-body">
                            <div class="blog-card-meta">
                                <i class="far fa-calendar-alt"></i> ${fecha}
                            </div>
                            <h2 class="blog-card-title">${titEsc}</h2>
                            <p class="blog-card-subtitle">${subEsc}</p>
                            <span class="blog-card-cta">Leer artículo <i class="fas fa-arrow-right"></i></span>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // Búsqueda en tiempo real
        const searchInput = document.getElementById('blog-search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.trim().toLowerCase();
                const filtrados = blogArticulosCache.filter(art => 
                    (art.titulo || '').toLowerCase().includes(term) ||
                    (art.subtitulo || '').toLowerCase().includes(term) ||
                    (art.contenido || '').toLowerCase().includes(term)
                );
                renderArticulos(filtrados);
            });
        }

        document.addEventListener('DOMContentLoaded', cargarArticulosBlog);
    </script>
</body>
</html>
